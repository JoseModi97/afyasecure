version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: afyasecure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afyasecure
      POSTGRES_PASSWORD: afyasecure_secret_password
      POSTGRES_DB: afyasecure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyasecure -d afyasecure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afyasecure-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://afyasecure:afyasecure_secret_password@postgres:5432/afyasecure_db
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
